version: 2
updates:
  # Actions, and the single runtime dependency.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR a week rather than one per action. Dependabot rewrites the SHA pin
      # and its trailing version comment together.
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
